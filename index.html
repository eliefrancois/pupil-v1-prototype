<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pupil — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@300..700&family=IBM+Plex+Sans:wght@300..600&family=Inter+Tight:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
  :root {
    /* Defaults — overridden by Tweaks via inline style on <html data-theme> */
    --primary: #7A60E4;
    --primary-hover: #6B4FD1;
    --primary-light: #EDE8FB;
    --primary-soft: #F5F1FE;

    --text: #1A1A2E;
    --text-2: #6B7280;
    --text-3: #9CA3AF;
    --bg: #FBFAF7;          /* warm cream instead of pure white */
    --surface: #FFFFFF;
    --surface-2: #F4F2EC;
    --border: #E8E4DA;
    --border-strong: #D7D2C4;

    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;

    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-sm: 0 1px 2px rgba(26,26,46,.04), 0 1px 1px rgba(26,26,46,.03);
    --shadow: 0 1px 2px rgba(26,26,46,.04), 0 8px 24px rgba(26,26,46,.06);
    --shadow-lg: 0 12px 40px rgba(26,26,46,.10), 0 2px 8px rgba(26,26,46,.05);

    --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-display: "Newsreader", "Geist", serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gap: 24px;       /* density base */
    --pad: 24px;
    --pad-sm: 16px;
    --row-h: 44px;

    --sidebar-w: 244px;
  }

  [data-density="compact"] {
    --gap: 16px;
    --pad: 18px;
    --pad-sm: 12px;
    --row-h: 38px;
  }
  [data-density="comfy"] {
    --gap: 32px;
    --pad: 32px;
    --pad-sm: 20px;
    --row-h: 52px;
  }

  [data-theme="dark"] {
    --text: #F4F2EC;
    --text-2: #A6A2B8;
    --text-3: #6E6A82;
    --bg: #15131F;
    --surface: #1C1929;
    --surface-2: #221F32;
    --border: #2A2740;
    --border-strong: #3A3656;
    --primary-light: #2A2150;
    --primary-soft: #20193D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100vh; overflow: hidden; }

  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
  h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.025em; }
  h2 { font-size: 24px; line-height: 1.2; }
  h3 { font-size: 18px; line-height: 1.3; }
  p { margin: 0; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { color: var(--primary-hover); }
  button { font-family: inherit; }
  ::selection { background: var(--primary-light); color: var(--text); }

  /* utility */
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .grow { flex: 1; min-width: 0; min-height: 0; }
  .muted { color: var(--text-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); font-weight: 500; }
  .mono { font-family: var(--font-mono); }
  .display { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; }
  .display em, .editorial em { font-style: italic; font-family: var(--font-display); font-weight: 400; }

  /* scrollbars */
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg); background-clip: content-box; }

  /* page transitions */
  @keyframes pg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .page-enter { animation: pg-in .28s cubic-bezier(.2,.7,.2,1) both; }

  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer {
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }

  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(122,96,228,.45); } 70% { box-shadow: 0 0 0 14px rgba(122,96,228,0); } 100% { box-shadow: 0 0 0 0 rgba(122,96,228,0); } }
  .pulse-ring { animation: pulse-ring 1.8s ease-out infinite; }

  @keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  /* Form basics */
  .input, .select, .textarea {
    width: 100%;
    padding: 0 14px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .textarea { padding: 12px 14px; height: auto; min-height: 96px; resize: vertical; line-height: 1.5; }
  .input:focus, .select:focus, .textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-light);
  }
  .label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }

  /* Brand mark */
  .brand-mark { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-weight: 600; font-size: 22px; letter-spacing: -0.025em; color: var(--text); }
  .brand-mark svg, .brand-mark img { display: block; }
</style>
</head>
